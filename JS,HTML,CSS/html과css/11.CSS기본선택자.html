<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS전체선택자</title>
    <style>
        /* 전체선택자 : 페이지에있는 모든태그를 대상으로 CSS를적용*/

        /*  !important  우선도가 가장높다
        
        important  > 미기재 */
         body{color:red  !important; }
         body{color:aqua ; }
         *{margin:0 ; padding: 0 }
         /* 타입선택자 : 특정 이름을 조건으로 모든태그를 대상으로 적용하는 선택자 */
         *{font-style: italic;}
         /* 클래스선택자
            1. 마침표(.)을 클래스 이름 앞에 사용하여 클래스 선택자를 설정 */
         /* 2. 클래스 선택자는 여러 태그에서 사용가능하다 */
         /* 3. 클래스 속성안에 여러 클래스 선택자를 설정할수있음 */
         /* class는 css에서 가장많이 사용되는 선택자이다 */
         .accent{
            border: 1px solid black;
            padding: 5px;
         }
         .bg{
            background-color: white;
         }
         /* 샾(#)을 ID속성의=값에대해 아이디선택자로써사용 */
         /* ID속성값은 중복사용불가 */
         #container{
            width: 500px;
            margin: 10px auto;
            padding: 10px;
            border: 1px solid black;
        }
        /* 그룹선택자 */
        /* 콤마(,)를 이용하여 선택자를 여러개 나열하는방식 */
        body{
            #container , .accent{
            text-align:center;}
        }
        /* CSS우선순위
        1순위:  !important
        2순위: 인라인스타일
        3순위: id style
        4순위: class style
        5순위: type style
        */

        .bg{
            background-color: beige;
        }
    </style>
 
</head>
<body>
    <!-- CHAR -->
    <span>A</span>
    <!-- CHARSET -->
<!--    <div>A</div>     -->
    <div id="container" style="color: aqua;"></div>
    /* id선택자 */
    <div id="container">
        <h1 class="accent bg">레드향</h1>
        <!-- 인라인스타일로 설정 -->
        <!-- <h1 style="color:red;">레드향 </h1> -->
        <!-- <h1>레드향 <span class="accent"></span></h1> -->
        <p>껍질에 붉은 빛이 돌아 레드향이라고 부른다.</p>
        <p>레드향은 한라봉과 귤을 교배한것으로...</p>
        <p>비타민 c와 비타민 P가 풍부해 혈액순환,감기예방 등에 좋은 것으로 알려져 있다.</p>
    </div>
    
</body>
</html>
