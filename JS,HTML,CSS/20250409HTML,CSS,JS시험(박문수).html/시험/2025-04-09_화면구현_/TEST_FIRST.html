<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ALL{position : fixed;
            margin: 10px;
            top: 50%;
            left: 50%;
            flex-direction: column;
            transform: translate(-50% , -50%);
        }
        .LOGIN_text{
            text-align:center;

        }
        .box1{width: 1000px; height: 100px;

        } 
        .box2{width: 1000px; height:370px;

            display: flex;
            justify-content:center;
            align-items: center;
            margin-inline:500px;
        }
        .box3{width: 800px; height: 300px;
                        align-items: center;
                        position : fixed;
            background-color: rgba(250, 248, 248, 0.941);

            display: flex;
            justify-content:center;
            align-items: center;
            margin-inline:50px ;}


        .login_BTN{
            background-color:black ;

        .login_BTN_TEXT{
            color: white;

        }

        .LOGIN_INPUT{width: 150px; height: 60px;margin: 30px 500px 30px 30px;}

</head>

    <!-- css here -->

    
<ALL class="ALL">

    <div class="box2">

       

        <div class="box3">

                <div class="LOGIN_INPUT1" id="idP">

                <input type="password" id="pw" name="pw" title="비밀번호" size="100px"></div>
                <button type="submit" class="login_BTN" id="login_BTN"><span class="login_BTN_TEXT" id="login">로그인</span>
            </button></form>

</container>
