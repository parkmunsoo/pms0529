<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid</title>
  <link rel="stylesheet" href="grid-basic.css">
  <style>
    .grid-container{
      display: grid;
      /* grid */
      /* 열을 설정하는 속성, 나열한 개수에따라 열이 늘어나게됨 */
      grid-template-columns: 100px 200px 100px;
      /* 행을 설정하는 속성, 나열한 개수에따라 행이 늘어나게됨 */
      grid-template-rows: 100px 200px 100px;
      /* gap : 행과 열의 간격 설정 */
      row-gap : 10px;
      column-gap: 20px;
      align-items: stretch;
      justify-items: stretch;
    }
    .grid-layout{
      display: grid;
      grid-template-columns: 100px 100px 100px;
      grid-template-rows: 50px 50px 50px;
      grid-template-areas:
      "header header header"
      "sidebar content content"
      "footer footer footer";
    }
    #header{grid-area:header;
       background-color: rgb(96, 241, 241);}
    #sidebar{grid-area:sidebar; 
      background-color: rgb(191, 217, 178);}
    #content{grid-area:content;
       background-color: rgb(213, 133, 197);}
    #footer{grid-area:footer; 
      background-color: rgb(252, 239, 239);}


  .grid-layout2 .grid-item:nth-child(1){
    grid-column-start: 3;
    grid-column-end :4;
  }
  .grid-layout2 .grid-item:nth-child(2){
    grid-column-start: 3;
    grid-column-end :4;
  }
  .grid-layout2 .grid-item:nth-child(3){
    grid-column-start: 2;
    grid-column-end :4;
  }
  .grid-layout2 .grid-item:nth-child(4){
    grid-column-start: 2;
    grid-column-end :4;
    grid-row-start: 2;
    grid-row-end :4;
  }
  </style>
</head>
<body>

  <div class="grid-layout">
    <div id="header">header</div>
    <div id="sidebar">sidebar</div>
    <div id="content">content</div>
    <div id="footer">footer</div>


  <div class="grid-container">
    <div class="grid-item">item-1</div>
    <div class="grid-item">item-2</div>
    <div class="grid-item">item-3</div>
    <div class="grid-item">item-4</div>

    <div class="grid-layout">
      <div id="header">header</div>
      <div id="sidebar">sidebar</div>
      <div id="content">content</div>
      <div id="footer">footer</div>
  </div>


  <div class="grid-layout">
    <div class="grid-item">item-1</div>
    <div class="grid-item">item-2</div>
    <div class="grid-item">item-3</div>
    <div class="grid-item">item-4</div>

  </div>

</body></html>
