<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes color_A{ 0%{background-color: aqua;} 25%{background-color:aquamarine; }
                    50%{background-color: beige;} 75%{background-color: blanchedalmond;}100%{background-color: azure;}
                    transform:translateX(50px);
                    transform:translateX(76px);

                }
        div{ animation-name: color_A;
            width:300px; height: 300px;
            background-color: aqua;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            text-align: justify;
            margin: 40px;
            font-size:xx-large;
        }
   



    </style>
</head>
<body>
    <div class="mov">ANIMATION</div>
</body>
