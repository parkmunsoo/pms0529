            let n = arr.length - 1;
            let m = 0;
            while (n =! m) {
                let arr_part_first = arr[m];
                let arr_part_last = arr[n];
                console.log(arr_part_first);
                console.log(arr_part_last);
                if (arr_part_first > arr_part_last) {
                    arr.splice(arr[m] , arr_part_last)
                }
                else if (n >= m) {
                    arr.splice(arr[n] , arr_part_first)
                }
                console.log("A" , arr);
                n--;
                m++;
         
            }

            return arr;
        }
