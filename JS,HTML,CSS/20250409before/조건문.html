<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36.반복문</title>
</head>
<body>
    <script>
        // 반복문 : 조건식이 true이면 반복하고 false면 반복이 끝나는 명령어
        // 초기값 : 반복이 시작될 값
        // while(조건식): 초기값이 false가 될때까지 확인할 조건식 
        //     증감식 : 조건식이 false가 되도록 초기값을 더하거나 빼는 식
        //     실행문
        let start = 0;
        while(start<10){
            start++;
            console.log(start+"번째 실행입니다.");
        }
        // 1~10까지의 합을 출력하자
        let value = 0;
        let total = 0;
        while(value<10){
            value++;
            total += value;
        }
        console.log(total);
    </script>

</body></html>
