<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes T{ 0%{background-color: aqua;} 25%{background-color:aquamarine; }
                    50%{background-color: beige;} 75%{background-color: blanchedalmond;}100%{background-color: azure;}}
        div{ animation-name: T;
            width:300px; height: 300px;
            background-color: aqua;
            animation-duration: 1s;
            animation-fill-mode: both;
            animation-iteration-count: infinite;
        }
    </style>
</head>
<body>
    <div>

    </div>
</body>
