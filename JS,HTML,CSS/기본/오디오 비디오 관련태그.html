<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오디오 , 비디오 관련태그</title>
</head>
<body>
    <!-- OBJ_TAG -->
    <!-- <object data="./" width="" , height=""></object> -->
     <object data="./medias/product.pdf" width="1000px" , height="800px"></object>
     <!-- imbed_ : 오래된 브라우저에서 멀티미디어 파일을 출력하는태그-->
     <embed src="./medias/spring.mp3" width="1000px" , height="800px">
    <!-- AUDIO_TAG : PLAY(file_name.audio) -->
    <!-- AUDIO_TAG : disable(AUTO_PLAY) -->
     <audio src="./medias/spring.mp3" controls></audio>
     <!-- (insert muted autoplay in normal)-> VIDIO_TAG_AUTO_PLAY_ANABLE -->
     <video src="./medias/flower.mp4" controls muted autoplay></video>
     <!-- IFRAME : a_HTML in b_HTML -->
     <iframe width="560" height="315" src="https://www.youtube.com/embed/rgI930gqdaY?si=WgJSip_LLQnmExHJ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
     <!-- d -->
</body>
</html>
