 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블 관련 태그 </title>
      <caption>        선물용과 가정용 상품 구성</caption>

    <!-- domain : css[] -->
    <style>
        table,th,td{
            /* 외곽선 : -의굵기 , 에대해실선적용, - 의색상 */
            border: 1px solid #ccc;
            /* 외곽선이 겹칠 경우 하나로합치는 설정 */
            border-collapse: collapse;
        }
        th , td { 
            /* 내부여백 : N,S    E,W*/
            padding: 10px 20px;
        }
    </style>
 </head>
 <body>
    <!-- table is not cmmand -->
     <!-- 표(table)  -->
    <table>
        <!-- tr태그 : 행(row) , 가로축 -->

        <!-- thead , tbody는 실제기능없음; 자료구분할때사용 -->
        <thead>   
            <tr>
        <!-- td태그 : 행과열이 교차한 두 면일때;  행과 열의 중첩면은 셀(cell)이다 , slot역할을한다-->
        <!-- td태그 -> th태그 -->
        <!-- th태그 : 테이블헤더 , 열의이름을 설정 -->
                <th>용도</th>
                <th>중량</th>
                <th>개수</th>
                <th>가격</th>
            </tr>
        </thead>
        <tbody>
        <!-- FIRST td1-td4] -->
        <tr>
        </tr>
            <td>선물용</td>
            <td>3kg</td>

        </tr>
        <!-- SECONDE td1-td4] -->
        <tr>
            <td>선물용</td>

        </tr>
        <tr>
            <td>가정용</td>
            <td>3kg</td>
            <td>11~16과</td>
            <td>30,000원</td>
        </tr>
        <!-- THIRD td1-td4] -->
        <tr>
            <td>가정용</td>
            <td>5kg</td>
            <td>18~26과</td>
            <td>47,000원</td>
        </tr>
         <!-- firth td1-td4] -->
        </tbody>
    </table>
