<body>
    <!-- method:GET -->
     <!-- GET : 주소를통해 웹의데이터를 받아올때 사용하는 메소드 -->
    <form action="./1_TEXT 관련태그.html" method="GET"> 
            <input type="text" name="id">
            <input type="password" name="pw">
            <input type="submit" value="전송">
    </form>

                                     <!-- method[[GET],[POST]] /  ? / & -->
        

    <!-- method:POST--> 
     <!-- POST : form내부에 데이터/파라미터를 넣고 전송할때 사용하는 메소드 -->
        <!-- 이점 : 보안성이뛰어나다 -->
     <form action="./1_TEXT 관련태그.html" method="POST"> 
        <!-- [INPUT[*DATA]] -->
         <!-- TYPE[*ID , *PW , *(vlaue[real_value])] -->
        <input type="text" name="id">
        <input type="password" name="pw">
        <!-- type="submit" :  insert BUTTON form for TYPE[submit] for arrival_link -->
        <input type="submit" value="전송">
    </form>



    <!-- form/ [action , method] /FIELDset/ legend[TEXT] -->
     <h1>레드향 주문하기</h1>
     <form action="#" method="POST"></form>
        <fieldset>
            <legend>회원정보</legend>
            <label>아이디<input type="text" name="id"></label>
            <label for="pw">비밀번호</label><input id = "pw" type="password" name="pw">
            <input type="submit" value="전송">
        </fieldset>
        <fieldset>
            <legend>상품선택</legend>
        </fieldset>
        <fieldset>
            <legend>배송정보</legend>
        </fieldset>
</body>
